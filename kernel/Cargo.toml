[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lib]
name = "kernel"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[dependencies]
bootloader_api = "0.11.17"
uart_16550 = "0.3.2"
spin = "0.9.8"
volatile = "0.2.6"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
x86_64 = "0.15.1"
pic8259 = "0.11.0"
noto-sans-mono-bitmap = { version = "0.3.1", default-features = false, features = ["regular", "size_16", "unicode-basic-latin"] }
linked_list_allocator = "0.10"
pc-keyboard = "0.8"

# These two tests check a single failure path each, so they run without the
# custom test harness (the kernel cannot continue after a panic or double fault).
[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
